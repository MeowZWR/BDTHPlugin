name: Create Release

on:
  push:
    tags:
      - '*-cn'
      - '!testing_*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"
      - name: Build
        run: |
          $ver = '${{ github.ref_name }}' -replace '-cn'
          dotnet build --no-restore --configuration Release --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }
      - name: write version into jsons
        run: |
          $ver = '${{ github.ref_name }}' -replace '-cn'
          $path = './BDTHPlugin/bin/Release/BDTHPlugin.json'
          if (-not (Test-Path $path)) {
            Write-Host "File not found at $path, trying alternative locations..."
            $altPaths = @(
              './BDTHPlugin/bin/x64/Release/BDTHPlugin.json',
              './BDTHPlugin/BDTHPlugin/bin/Release/BDTHPlugin.json',
              './BDTHPlugin/BDTHPlugin/bin/x64/Release/BDTHPlugin.json'
            )
            $found = $false
            foreach ($altPath in $altPaths) {
              if (Test-Path $altPath) {
                $path = $altPath
                $found = $true
                Write-Host "Found file at $path"
                break
              }
            }
            if (-not $found) {
              Write-Host "Listing directory structure:"
              Get-ChildItem -Path ./BDTHPlugin -Recurse -Filter BDTHPlugin.json | ForEach-Object { Write-Host $_.FullName }
              throw "BDTHPlugin.json not found in any expected location"
            }
          }
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = $ver
          $content = $json | ConvertTo-Json
          Set-Content -Path $path -Value $content
      - name: Archive
        run: |
          $releasePaths = @(
            './BDTHPlugin/bin/Release',
            './BDTHPlugin/bin/x64/Release'
          )
          $foundPath = $null
          foreach ($path in $releasePaths) {
            if (Test-Path $path) {
              $files = Get-ChildItem -Path $path -File
              if ($files.Count -gt 0) {
                $foundPath = $path
                Write-Host "Found build output at: $path"
                break
              }
            }
          }
          if (-not $foundPath) {
            Write-Host "Listing directory structure:"
            Get-ChildItem -Path ./BDTHPlugin -Recurse -Directory | ForEach-Object { Write-Host $_.FullName }
            throw "Build output directory not found"
          }
          $files = Get-ChildItem -Path $foundPath -File
          if ($files.Count -eq 0) {
            throw "No files found in $foundPath"
          }
          Write-Host "Found $($files.Count) files to archive:"
          $files | ForEach-Object { Write-Host "  $($_.FullName)" }
          $filePaths = $files | ForEach-Object { $_.FullName }
          Compress-Archive -Path $filePaths -DestinationPath BDTHPlugin.zip -Force
          Write-Host "Archive created successfully"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./BDTHPlugin/bin/Release/*
            ./BDTHPlugin/bin/x64/Release/*
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BDTHPlugin ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./BDTHPlugin.zip
          asset_name: BDTHPlugin.zip
          asset_content_type: application/zip

      - name: Write out repo.json
        run: |
          $ver = '${{ github.ref_name }}'
          $verBase = $ver -replace '-cn$', ''
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].AssemblyVersion = $verBase
          $json[0].TestingAssemblyVersion = $verBase
          $json[0].DownloadLinkInstall = $json.DownloadLinkInstall -replace '[^/]+/BDTHPlugin.zip',"$ver/BDTHPlugin.zip"
          $json[0].DownloadLinkTesting = $json.DownloadLinkTesting -replace '[^/]+/BDTHPlugin.zip',"$ver/BDTHPlugin.zip"
          $json[0].DownloadLinkUpdate = $json.DownloadLinkUpdate -replace '[^/]+/BDTHPlugin.zip',"$ver/BDTHPlugin.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin cn
          git branch -f cn ${{ github.sha }}
          git checkout cn
          git add repo.json
          git commit -m "[CI] Updating repo.json for ${{ github.ref_name }}" || true
          git push origin cn
          
  trigger_workflow:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Workflow in DalamudPlugin Repository
        run: |
          repo_owner="MeowZWR"
          repo_name="DalamudPlugin"
          event_type="request-update-run-action"
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MEOWRSTRIGGER }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
            -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"unit\": false, \"integration\": true}}"
